name: RedLoop Pro - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code - GitHub থেকে Code নেওয়া
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get Packages
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Build APK Debug - cPanel Server Based App
        run: flutter build apk --debug

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redloop-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
